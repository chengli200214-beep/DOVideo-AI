# Disposable acceptance environment. No bind mounts or production credentials.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: generation_it
      MYSQL_USER: generation_it
      MYSQL_PASSWORD: ${GENERATION_IT_DB_PASSWORD:?run the acceptance script}
      MYSQL_ROOT_PASSWORD: ${GENERATION_IT_DB_PASSWORD:?run the acceptance script}
    ports:
      - target: 3306
        host_ip: 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -ugeneration_it -Dgeneration_it -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    ports:
      - target: 6379
        host_ip: 127.0.0.1
    environment:
      REDIS_PASSWORD: ${GENERATION_IT_REDIS_PASSWORD:?run the acceptance script}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: dovideo-minio:RELEASE.2025-09-07T16-13-09Z-source
    build:
      context: ./infrastructure/minio
    environment:
      MINIO_ROOT_USER: generation-it
      MINIO_ROOT_PASSWORD: ${GENERATION_IT_MINIO_PASSWORD:?run the acceptance script}
    command: server /data
    ports:
      - target: 9000
        host_ip: 127.0.0.1
