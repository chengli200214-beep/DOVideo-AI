server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
# 仅在可信反向代理之后设为 native，否则客户端可伪造 X-Forwarded-For 绕过登录 IP 限流。
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
auth.login.max-failures-per-ip=${AUTH_MAX_LOGIN_FAILURES_PER_IP:30}
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:180000}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Model gateway
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.deepseek.model=${LLM_MODEL:deepseek-flash}
ai.deepseek.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
ai.deepseek.input-price-per-million=${LLM_INPUT_PRICE_PER_MILLION:0}
ai.deepseek.output-price-per-million=${LLM_OUTPUT_PRICE_PER_MILLION:0}
# Optional services for the original video-understanding app; never share the DeepSeek key.
ai.embedding.enabled=${EMBEDDING_ENABLED:false}
ai.embedding.api-key=${EMBEDDING_API_KEY:}
ai.embedding.base-url=${EMBEDDING_BASE_URL:}
ai.embedding.model=${EMBEDDING_MODEL:}
ai.asr.enabled=${ASR_ENABLED:false}
ai.asr.api-key=${ASR_API_KEY:}
ai.asr.url=${ASR_URL:}
ai.asr.model=${ASR_MODEL:}

# Agent termination budget
agent.budget.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.budget.max-duration-ms=${AGENT_MAX_DURATION_MS:120000}
agent.budget.max-estimated-tokens=${AGENT_MAX_ESTIMATED_TOKENS:50000}
# 0 means disabled. When enabled, configure both provider prices above.
agent.budget.max-estimated-cost=${AGENT_MAX_ESTIMATED_COST:0}
agent.evaluation.enabled=${AGENT_EVALUATION_ENABLED:false}

# Vector store
vector.qdrant.enabled=${QDRANT_ENABLED:true}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.api-key=${QDRANT_API_KEY:}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-read=${MINIO_PUBLIC_READ:false}

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
# 部分站点（如 B 站）需要登录态 cookie 才能下载，否则返回 HTTP 412。
# 二者互斥，YTDLP_COOKIES（Netscape 格式文件）优先，更适合服务端无人值守场景。
tool.ytdlp.cookies=${YTDLP_COOKIES:}
tool.ytdlp.cookies-from-browser=${YTDLP_COOKIES_FROM_BROWSER:}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-producer}
rocketmq.producer.send-message-timeout=3000
rocketmq.topic.video-analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis-topic}
rocketmq.topic.video-analysis-dead=${ROCKETMQ_ANALYSIS_DEAD_TOPIC:video-analysis-dead-topic}
rocketmq.consumer.group=${ROCKETMQ_ANALYSIS_GROUP:video-analysis-consumer}

# Video generation: mock is local and never sends a model request.
generation.provider=${GENERATION_PROVIDER:mock}
generation.paid-enabled=${GENERATION_PAID_ENABLED:false}
generation.text-model=${GENERATION_TEXT_MODEL:doubao-seedance-2-0-mini-260615}
generation.image-model=${GENERATION_IMAGE_MODEL:doubao-seedance-2-0-mini-260615}
# Seedance is the only paid video provider. Recovery never permits new submissions.
generation.seedance.api-key=${SEEDANCE_API_KEY:}
generation.seedance.base-url=${SEEDANCE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
generation.seedance.artifact-hosts=${SEEDANCE_ARTIFACT_HOSTS:}
generation.seedance.recovery-enabled=${SEEDANCE_RECOVERY_ENABLED:false}
generation.worker-delay-ms=${GENERATION_WORKER_DELAY_MS:2000}
# Approved invocation scope. Reservations survive restarts and include unknown/failed submissions.
generation.authorization-id=${GENERATION_AUTHORIZATION_ID:}
generation.approved-models=${GENERATION_APPROVED_MODELS:}
generation.max-paid-tasks=${GENERATION_MAX_PAID_TASKS:0}
generation.budget-limit=${GENERATION_BUDGET_LIMIT:0}
generation.reservation-per-task=${GENERATION_RESERVATION_PER_TASK:0}
# Configure each deployed model's capability independently; duration is not a submission parameter.
generation.text.enabled=${GENERATION_TEXT_ENABLED:true}
generation.text.sizes=${GENERATION_TEXT_SIZES:1280x720,720x1280,960x960}
generation.text.negative-prompt=${GENERATION_TEXT_NEGATIVE_PROMPT:true}
generation.text.seed=${GENERATION_TEXT_SEED:true}
generation.text.max-prompt-length=${GENERATION_TEXT_MAX_PROMPT_LENGTH:2000}
generation.image.enabled=${GENERATION_IMAGE_ENABLED:true}
generation.image.sizes=${GENERATION_IMAGE_SIZES:1280x720,720x1280,960x960}
generation.image.negative-prompt=${GENERATION_IMAGE_NEGATIVE_PROMPT:true}
generation.image.seed=${GENERATION_IMAGE_SEED:true}
generation.image.max-prompt-length=${GENERATION_IMAGE_MAX_PROMPT_LENGTH:2000}

# Independent local composition worker; no model invocation.
spring.task.scheduling.pool.size=3
composition.ffmpeg-dir=${FFMPEG_DIR:}
composition.font-path=${COMPOSITION_FONT_PATH:}
composition.worker-delay-ms=${COMPOSITION_WORKER_DELAY_MS:2000}

# Independent opt-in for script/storyboard generation; never inherits the analysis LLM key.
storyboard.model.paid-enabled=${STORYBOARD_PAID_ENABLED:false}
storyboard.model.api-key=${STORYBOARD_API_KEY:}
storyboard.model.base-url=${STORYBOARD_BASE_URL:https://api.deepseek.com}
storyboard.model.model=${STORYBOARD_MODEL:deepseek-flash}
storyboard.model.authorization-id=${STORYBOARD_AUTHORIZATION_ID:}
storyboard.model.approved-model=${STORYBOARD_APPROVED_MODEL:}
storyboard.model.currency=${STORYBOARD_CURRENCY:CNY}
storyboard.model.max-calls=${STORYBOARD_MAX_CALLS:0}
storyboard.model.budget-limit=${STORYBOARD_BUDGET_LIMIT:0}
storyboard.model.reservation-per-call=${STORYBOARD_RESERVATION_PER_CALL:0}
storyboard.model.input-price-per-million=${STORYBOARD_INPUT_PRICE_PER_MILLION:0}
storyboard.model.output-price-per-million=${STORYBOARD_OUTPUT_PRICE_PER_MILLION:0}
storyboard.model.max-tokens=${STORYBOARD_MAX_TOKENS:4096}
storyboard.model.timeout-seconds=${STORYBOARD_TIMEOUT_SECONDS:60}
storyboard.model.worker-delay-ms=${STORYBOARD_WORKER_DELAY_MS:2000}
